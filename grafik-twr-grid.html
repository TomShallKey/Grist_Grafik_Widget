<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grafik Szkoleniowy TWR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #1a1a24;
      --bg-hover: #22222e;
      --border-subtle: rgba(255,255,255,0.06);
      --border-active: rgba(255,255,255,0.12);
      --text-primary: #f0f0f5;
      --text-secondary: #8888a0;
      --text-muted: #555566;
      
      /* Faza colors - vibrant but sophisticated */
      --faza-1: #22c55e;
      --faza-1-bg: rgba(34, 197, 94, 0.12);
      --faza-2: #3b82f6;
      --faza-2-bg: rgba(59, 130, 246, 0.12);
      --faza-3: #f59e0b;
      --faza-3-bg: rgba(245, 158, 11, 0.12);
      --faza-4: #ef4444;
      --faza-4-bg: rgba(239, 68, 68, 0.12);
      --faza-5: #a855f7;
      --faza-5-bg: rgba(168, 85, 247, 0.12);
      
      --slot-height: 80px;
      --header-height: 56px;
      --time-col-width: 70px;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: auto;
    }
    
    .container {
      padding: 20px;
      min-width: fit-content;
    }
    
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
    }
    
    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 0%, #888 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .legend {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
    
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
    }
    
    .calendar-grid {
      display: grid;
      gap: 1px;
      background: var(--border-subtle);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    
    .time-header {
      background: var(--bg-secondary);
      padding: 16px 12px;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .day-header {
      background: var(--bg-secondary);
      padding: 14px 16px;
      text-align: center;
      border-bottom: 1px solid var(--border-subtle);
    }
    
    .day-name {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }
    
    .day-date {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    
    .day-date.today {
      color: var(--faza-2);
    }
    
    .time-slot {
      background: var(--bg-secondary);
      padding: 8px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-secondary);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: var(--slot-height);
    }
    
    .cell {
      background: var(--bg-primary);
      min-height: var(--slot-height);
      position: relative;
      padding: 4px;
    }
    
    .session-card {
      position: absolute;
      left: 4px;
      right: 4px;
      top: 4px;
      background: var(--bg-card);
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
    }
    
    .session-card:hover {
      border-color: var(--border-active);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    
    .session-card.warning {
      border-color: rgba(239, 68, 68, 0.4);
      box-shadow: 0 0 0 1px rgba(239, 68, 68, 0.2);
    }
    
    .session-indicator {
      height: 3px;
      flex-shrink: 0;
    }
    
    .session-content {
      padding: 10px 12px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
    }
    
    .trainee-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .trainee-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
    }
    
    .trainee-badge.trainee-a {
      background: var(--faza-1-bg);
      color: var(--faza-1);
    }
    
    .trainee-badge.trainee-b {
      background: var(--faza-2-bg);
      color: var(--faza-2);
    }
    
    .trainee-name {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    
    .faza-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    
    .faza-1 { background: var(--faza-1-bg); color: var(--faza-1); }
    .faza-2 { background: var(--faza-2-bg); color: var(--faza-2); }
    .faza-3 { background: var(--faza-3-bg); color: var(--faza-3); }
    .faza-4 { background: var(--faza-4-bg); color: var(--faza-4); }
    .faza-5 { background: var(--faza-5-bg); color: var(--faza-5); }
    
    .ex-number {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--text-muted);
      margin-left: auto;
    }
    
    .session-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-top: 6px;
      border-top: 1px solid var(--border-subtle);
      margin-top: auto;
    }
    
    .instructor-list {
      font-size: 0.7rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }
    
    .kategoria-badge {
      font-size: 0.6rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 3px;
      background: rgba(255,255,255,0.06);
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      flex-shrink: 0;
    }
    
    .session-time-range {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--text-muted);
      padding: 4px 8px;
      background: rgba(0,0,0,0.2);
      border-radius: 0 0 6px 6px;
      text-align: center;
    }
    
    .empty-cell {
      background: var(--bg-primary);
      min-height: var(--slot-height);
    }
    
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 400px;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }
    
    .loading-spinner {
      width: 24px;
      height: 24px;
      border: 2px solid var(--border-subtle);
      border-top-color: var(--faza-2);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 12px;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .no-data {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }
    
    .no-data-icon {
      font-size: 3rem;
      margin-bottom: 16px;
      opacity: 0.3;
    }
    
    /* Tooltip */
    .tooltip {
      position: fixed;
      background: var(--bg-card);
      border: 1px solid var(--border-active);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.8rem;
      max-width: 300px;
      z-index: 1000;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: all 0.15s ease;
    }
    
    .tooltip.visible {
      opacity: 1;
      transform: translateY(0);
    }
    
    .tooltip-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 4px 0;
    }
    
    .tooltip-label {
      color: var(--text-muted);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .tooltip-value {
      color: var(--text-primary);
      font-weight: 500;
    }
    
    /* Week navigation */
    .week-nav {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .week-nav button {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    
    .week-nav button:hover {
      background: var(--bg-hover);
      border-color: var(--border-active);
      color: var(--text-primary);
    }
    
    .current-week {
      font-size: 0.85rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* Compact mode for many slots */
    .session-card.compact .session-content {
      padding: 6px 8px;
      gap: 4px;
    }
    
    .session-card.compact .trainee-name {
      font-size: 0.7rem;
    }
    
    .session-card.compact .session-meta {
      padding-top: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📋 Grafik Szkoleniowy TWR</h1>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background: var(--faza-1)"></div>F1</div>
        <div class="legend-item"><div class="legend-dot" style="background: var(--faza-2)"></div>F2</div>
        <div class="legend-item"><div class="legend-dot" style="background: var(--faza-3)"></div>F3</div>
        <div class="legend-item"><div class="legend-dot" style="background: var(--faza-4)"></div>F4</div>
      </div>
    </div>
    
    <div id="calendar-container">
      <div class="loading">
        <div class="loading-spinner"></div>
        Ładowanie danych z Grist...
      </div>
    </div>
  </div>
  
  <div class="tooltip" id="tooltip"></div>

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script>
    // State
    let allRecords = [];
    let timeSlots = [];
    let days = [];
    let currentWeekStart = null;
    
    // Grist API setup
    grist.ready({
      columns: [
        'Data', 'Slot', 'Slot_Godz_od', 'Slot_Godz_do',
        'TWR1_TraineeA', 'TWR1_TraineeB', 'TraineeA_Nazwa', 'TraineeB_Nazwa',
        'TWR1_TraineeA_Faza', 'TWR1_TraineeB_Faza',
        'exNrA', 'exNrB', 'Instr_lista', 'Kat_Nazwa', 'C',
        'Data_DzienPL', 'Data_Tydzien',
        'TraineeA_Narusza8h', 'TraineeB_Narusza8h'
      ],
      requiredAccess: 'read table'
    });
    
    grist.onRecords(function(records, mappings) {
      console.log('Received records:', records.length);
      allRecords = records.map(r => mapRecord(r, mappings));
      renderCalendar();
    });
    
    function mapRecord(rec, mappings) {
      // Map column names if mappings exist
      const get = (col) => {
        if (mappings && mappings[col]) {
          return rec[mappings[col]];
        }
        return rec[col];
      };
      
      return {
        id: rec.id,
        data: get('Data'),
        slot: get('Slot'),
        slotOd: get('Slot_Godz_od'),
        slotDo: get('Slot_Godz_do'),
        traineeA: get('TWR1_TraineeA'),
        traineeB: get('TWR1_TraineeB'),
        traineeANazwa: get('TraineeA_Nazwa') || '',
        traineeBNazwa: get('TraineeB_Nazwa') || '',
        fazaA: get('TWR1_TraineeA_Faza') || '',
        fazaB: get('TWR1_TraineeB_Faza') || '',
        exNrA: get('exNrA'),
        exNrB: get('exNrB'),
        instrLista: get('Instr_lista') || '',
        kategoria: get('Kat_Nazwa') || '',
        c: get('C'),
        dzienPL: get('Data_DzienPL') || '',
        tydzien: get('Data_Tydzien') || '',
        narusza8hA: get('TraineeA_Narusza8h'),
        narusza8hB: get('TraineeB_Narusza8h')
      };
    }
    
    function parseTime(timeStr) {
      if (!timeStr) return null;
      const parts = String(timeStr).split(':');
      return parseInt(parts[0]) * 60 + (parseInt(parts[1]) || 0);
    }
    
    function formatTime(minutes) {
      const h = Math.floor(minutes / 60);
      const m = minutes % 60;
      return `${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`;
    }
    
    function getFazaNumber(fazaStr) {
      if (!fazaStr) return null;
      const match = String(fazaStr).match(/(\d+)/);
      return match ? parseInt(match[1]) : null;
    }
    
    function getFazaColor(fazaNum) {
      const colors = {
        1: '#22c55e',
        2: '#3b82f6', 
        3: '#f59e0b',
        4: '#ef4444',
        5: '#a855f7'
      };
      return colors[fazaNum] || '#666';
    }
    
    function groupConsecutiveSessions(sessions) {
      if (!sessions.length) return [];
      
      // Sort by time
      sessions.sort((a, b) => parseTime(a.slotOd) - parseTime(b.slotOd));
      
      const groups = [];
      let currentGroup = [sessions[0]];
      
      for (let i = 1; i < sessions.length; i++) {
        const prev = sessions[i - 1];
        const curr = sessions[i];
        
        // Check if consecutive and same trainee combo
        const prevEnd = parseTime(prev.slotDo);
        const currStart = parseTime(curr.slotOd);
        
        const sameTraineeA = prev.traineeA === curr.traineeA;
        const sameTraineeB = prev.traineeB === curr.traineeB;
        const isConsecutive = Math.abs(currStart - prevEnd) <= 15; // 15 min tolerance
        
        if (isConsecutive && sameTraineeA && sameTraineeB) {
          currentGroup.push(curr);
        } else {
          groups.push(currentGroup);
          currentGroup = [curr];
        }
      }
      groups.push(currentGroup);
      
      return groups;
    }
    
    function renderCalendar() {
      const container = document.getElementById('calendar-container');
      
      if (!allRecords.length) {
        container.innerHTML = `
          <div class="no-data">
            <div class="no-data-icon">📅</div>
            <p>Brak danych do wyświetlenia</p>
            <p style="font-size: 0.8rem; margin-top: 8px; opacity: 0.6">
              Upewnij się, że widget ma dostęp do tabeli GRAFIK
            </p>
          </div>
        `;
        return;
      }
      
      // Extract unique days and time slots
      const uniqueDays = [...new Set(allRecords.map(r => r.data))].filter(Boolean).sort((a, b) => a - b);
      const uniqueSlots = [...new Set(allRecords.map(r => r.slotOd))].filter(Boolean);
      
      // Sort slots by time
      uniqueSlots.sort((a, b) => parseTime(a) - parseTime(b));
      
      // Get day names mapping
      const dayNames = {};
      allRecords.forEach(r => {
        if (r.data && r.dzienPL) {
          dayNames[r.data] = r.dzienPL;
        }
      });
      
      // Build grid
      const numCols = uniqueDays.length + 1; // +1 for time column
      
      let html = `
        <div class="calendar-grid" style="grid-template-columns: var(--time-col-width) repeat(${uniqueDays.length}, minmax(180px, 1fr));">
          <div class="time-header">Godziny</div>
      `;
      
      // Day headers
      uniqueDays.forEach(dayId => {
        const dayName = dayNames[dayId] || '';
        html += `
          <div class="day-header">
            <div class="day-name">${dayName}</div>
            <div class="day-date">${dayId}</div>
          </div>
        `;
      });
      
      // Rows for each time slot
      uniqueSlots.forEach((slotTime, slotIndex) => {
        const slotEnd = allRecords.find(r => r.slotOd === slotTime)?.slotDo || '';
        
        html += `<div class="time-slot">${slotTime}<br><span style="opacity:0.5">-${slotEnd}</span></div>`;
        
        uniqueDays.forEach(dayId => {
          // Find sessions for this day and slot
          const daySessions = allRecords.filter(r => r.data === dayId);
          const slotSessions = daySessions.filter(r => r.slotOd === slotTime);
          
          // Group consecutive sessions
          const groups = groupConsecutiveSessions(slotSessions);
          
          html += `<div class="cell" data-day="${dayId}" data-slot="${slotTime}">`;
          
          groups.forEach((group, groupIndex) => {
            const first = group[0];
            const last = group[group.length - 1];
            
            // Calculate height based on number of slots spanned
            const startTime = parseTime(first.slotOd);
            const endTime = parseTime(last.slotDo);
            const slotDuration = parseTime(uniqueSlots[1]) - parseTime(uniqueSlots[0]) || 60;
            const slotsSpanned = Math.max(1, Math.ceil((endTime - startTime) / slotDuration));
            const height = slotsSpanned * 80 - 8; // slot height minus padding
            
            const fazaANum = getFazaNumber(first.fazaA);
            const fazaBNum = getFazaNumber(first.fazaB);
            const indicatorColor = getFazaColor(fazaANum || fazaBNum);
            
            const hasWarning = first.narusza8hA || first.narusza8hB;
            const isCompact = slotsSpanned === 1;
            
            html += `
              <div class="session-card ${hasWarning ? 'warning' : ''} ${isCompact ? 'compact' : ''}" 
                   style="height: ${height}px;"
                   data-session-id="${first.id}"
                   onmouseenter="showTooltip(event, ${JSON.stringify(first).replace(/"/g, '&quot;')})"
                   onmouseleave="hideTooltip()">
                <div class="session-indicator" style="background: ${indicatorColor}"></div>
                <div class="session-content">
            `;
            
            // Trainee A
            if (first.traineeANazwa) {
              html += `
                <div class="trainee-row">
                  <span class="trainee-badge trainee-a">A</span>
                  <span class="trainee-name">${first.traineeANazwa}</span>
                  ${fazaANum ? `<span class="faza-tag faza-${fazaANum}">F${fazaANum}</span>` : ''}
                  ${first.exNrA ? `<span class="ex-number">#${first.exNrA}</span>` : ''}
                </div>
              `;
            }
            
            // Trainee B
            if (first.traineeBNazwa && first.c) {
              html += `
                <div class="trainee-row">
                  <span class="trainee-badge trainee-b">B</span>
                  <span class="trainee-name">${first.traineeBNazwa}</span>
                  ${fazaBNum ? `<span class="faza-tag faza-${fazaBNum}">F${fazaBNum}</span>` : ''}
                  ${first.exNrB ? `<span class="ex-number">#${first.exNrB}</span>` : ''}
                </div>
              `;
            }
            
            // Meta row (instructors, category)
            if (first.instrLista || first.kategoria) {
              html += `
                <div class="session-meta">
                  <span class="instructor-list">${first.instrLista || '—'}</span>
                  ${first.kategoria ? `<span class="kategoria-badge">${first.kategoria}</span>` : ''}
                </div>
              `;
            }
            
            html += `
                </div>
                ${slotsSpanned > 1 ? `<div class="session-time-range">${first.slotOd} → ${last.slotDo}</div>` : ''}
              </div>
            `;
          });
          
          html += `</div>`;
        });
      });
      
      html += `</div>`;
      container.innerHTML = html;
    }
    
    // Tooltip functions
    function showTooltip(event, session) {
      const tooltip = document.getElementById('tooltip');
      
      let content = `
        <div class="tooltip-row">
          <span class="tooltip-label">Godziny</span>
          <span class="tooltip-value">${session.slotOd} - ${session.slotDo}</span>
        </div>
      `;
      
      if (session.traineeANazwa) {
        content += `
          <div class="tooltip-row">
            <span class="tooltip-label">Trainee A</span>
            <span class="tooltip-value">${session.traineeANazwa} (F${getFazaNumber(session.fazaA) || '?'})</span>
          </div>
        `;
      }
      
      if (session.traineeBNazwa && session.c) {
        content += `
          <div class="tooltip-row">
            <span class="tooltip-label">Trainee B</span>
            <span class="tooltip-value">${session.traineeBNazwa} (F${getFazaNumber(session.fazaB) || '?'})</span>
          </div>
        `;
      }
      
      if (session.instrLista) {
        content += `
          <div class="tooltip-row">
            <span class="tooltip-label">Instruktorzy</span>
            <span class="tooltip-value">${session.instrLista}</span>
          </div>
        `;
      }
      
      if (session.narusza8hA || session.narusza8hB) {
        content += `
          <div class="tooltip-row" style="color: #ef4444;">
            <span class="tooltip-label">⚠️ Uwaga</span>
            <span class="tooltip-value">Naruszenie reguły 8h</span>
          </div>
        `;
      }
      
      tooltip.innerHTML = content;
      
      const rect = event.target.getBoundingClientRect();
      tooltip.style.left = `${rect.right + 10}px`;
      tooltip.style.top = `${rect.top}px`;
      tooltip.classList.add('visible');
    }
    
    function hideTooltip() {
      document.getElementById('tooltip').classList.remove('visible');
