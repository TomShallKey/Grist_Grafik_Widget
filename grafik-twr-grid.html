<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f7f7f7;
      height: 100vh;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    /* Controls Header */
    .controls {
      padding: 8px 16px;
      background: white;
      border-bottom: 1px solid #ddd;
      display: flex;
      gap: 20px;
      align-items: center;
      flex-shrink: 0;
    }

    .date-picker {
      font-size: 14px;
      padding: 4px;
    }

    .info {
      font-size: 12px;
      color: #666;
    }

    /* Grid Container */
    .schedule-container {
      flex-grow: 1;
      overflow: auto;
      padding: 10px;
    }

    .grid {
      display: grid;
      /* Columns will be set dynamically via style */
      gap: 4px;
    }

    /* Headers */
    .header-col {
      background: #4B4B4B;
      color: white;
      padding: 8px;
      text-align: center;
      font-weight: bold;
      position: sticky;
      top: 0;
      z-index: 10;
      border-radius: 4px;
      min-width: 150px;
    }

    .header-row {
      background: #e0e0e0;
      padding: 10px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      position: sticky;
      left: 0;
      z-index: 5;
      border-radius: 4px;
    }

    /* Data Cell */
    .cell {
      background: white;
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 6px;
      font-size: 11px;
      min-height: 80px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: background 0.2s;
      position: relative;
    }

    .cell:hover {
      background: #f0f8ff;
      border-color: #3b82f6;
    }

    .cell.empty {
      background: #fafafa;
      border: 1px dashed #ddd;
      cursor: default;
    }

    /* Content Styling */
    .trainee-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #eee;
      padding-bottom: 2px;
    }
    .trainee-name { font-weight: 600; color: #333; }
    .trainee-ex { font-weight: bold; color: #d32f2f; }

    .instr-row {
      color: #555;
      font-style: italic;
      font-size: 10px;
    }

    .cat-badge {
      align-self: flex-start;
      background: #e0f2f1;
      color: #00695c;
      padding: 2px 4px;
      border-radius: 3px;
      font-size: 9px;
      margin-top: auto; /* Push to bottom */
    }
    
    .loading { padding: 20px; text-align: center; }
  </style>
</head>
<body>

<div id="app">
  <div class="controls">
    <label>
      <strong>Data Grafiku:</strong>
      <input type="date" class="date-picker" v-model="selectedDate" @change="manualDateChange">
    </label>
    <span class="info">Liczba sesji: {{ currentSessions.length }}</span>
  </div>

  <div class="schedule-container" v-if="ready">
    <div class="grid" :style="{ gridTemplateColumns: `80px repeat(${stations.length}, 1fr)` }">
      
      <div class="header-col" style="background:transparent; z-index: 11; background-color: #f7f7f7;"></div>

      <div v-for="station in stations" :key="station" class="header-col">
        {{ station }}
      </div>

      <template v-for="slot in slots" :key="slot">
        <div class="header-row">
          {{ slot }}
        </div>

        <div v-for="station in stations" :key="station + slot" 
             :class="['cell', { empty: !getCell(slot, station) }]"
             @click="selectRecord(getCell(slot, station))">
          
          <template v-if="getCell(slot, station)">
            <div class="trainee-row" v-if="getCell(slot, station).TraineeA">
              <span class="trainee-name">{{ getCell(slot, station).TraineeA }}</span>
              <span class="trainee-ex">{{ getCell(slot, station).ExA }}</span>
            </div>

            <div class="trainee-row" v-if="getCell(slot, station).TraineeB && getCell(slot, station).C">
              <span class="trainee-name">{{ getCell(slot, station).TraineeB }}</span>
              <span class="trainee-ex">{{ getCell(slot, station).ExB }}</span>
            </div>

            <div class="instr-row">
               Instr: {{ formatInstr(getCell(slot, station)) }}
            </div>

            <div class="cat-badge" v-if="getCell(slot, station).Rodzaj">
              {{ getCell(slot, station).Rodzaj }}
            </div>
          </template>

        </div>
      </template>

    </div>
  </div>
  <div v-else class="loading">Ładowanie danych...</div>
</div>

<script>
  const { createApp, ref, computed, onMounted } = Vue;

  createApp({
    setup() {
      const records = ref([]);
      const ready = ref(false);
      const selectedDate = ref(new Date().toISOString().split('T')[0]);
      
      // CONFIGURATION: Mapowanie nazw kolumn z Grist
      const COL_MAPPING = {
        Data: 'Data',
        Slot: 'Slot_Godz_od',
        Stanowisko: 'Stanowisko',
        TraineeA: 'TraineeA_Nazwa',
        TraineeB: 'TraineeB_Nazwa',
        ExA: 'exNrA',
        ExB: 'exNrB',
        Instr1: 'Instr1',
        Instr2: 'Instr2',
        Instr3: 'Instr3',
        Rodzaj: 'Rodzaj',
        C: 'C'
      };

      // Helper to parse Grist date (seconds or ISO string)
      const parseDate = (val) => {
        if (!val) return null;
        if (typeof val === 'number') return new Date(val * 1000).toISOString().split('T')[0];
        if (typeof val === 'string') return val.split('T')[0]; // Assuming ISO like format
        return String(val); // Fallback
      };

      onMounted(() => {
        grist.ready({requiredAccess: 'read table'});
        
        grist.onRecords((data) => {
          // Transform raw Grist records into easier objects
          records.value = grist.mapColumnNames(data, COL_MAPPING);
          
          // Try to set date to the cursor's date if available, else today
          // We look at the last selected record if possible, but simplistic approach first:
          if (records.value.length > 0) {
             // Default logic: If user selects a row in Grist, filter widget by that date
             grist.onRecord((rec) => {
               if(rec) {
                 const mapped = grist.mapColumnNames(rec, COL_MAPPING);
                 if(mapped.Data) {
                    selectedDate.value = parseDate(mapped.Data);
                 }
               }
             });
          }
          ready.value = true;
        });
      });

      // Filter records by selected date
      const currentSessions = computed(() => {
        return records.value.filter(r => parseDate(r.Data) === selectedDate.value);
      });

      // Extract unique Slots (sorted)
      const slots = computed(() => {
        const s = new Set(currentSessions.value.map(r => r.Slot).filter(Boolean));
        return Array.from(s).sort(); // String sort works for "08:00", "09:00"
      });

      // Extract unique Stations (sorted)
      const stations = computed(() => {
         // You can hardcode stations here if you want a fixed order, e.g.:
         // return ['Stanowisko 1', 'Stanowisko 2', ...];
         const s = new Set(currentSessions.value.map(r => String(r.Stanowisko || 'Bezimienne')));
         return Array.from(s).sort();
      });

      // Helper to find record for a specific cell
      const getCell = (slot, station) => {
        return currentSessions.value.find(r => 
          r.Slot === slot && 
          String(r.Stanowisko || 'Bezimienne') === station
        );
      };

      const formatInstr = (rec) => {
        const i = [rec.Instr1, rec.Instr2, rec.Instr3].filter(x => x && x !== '0' && x !== 0);
        return i.join(', ');
      };

      const selectRecord = (rec) => {
        if (rec && rec.id) {
          grist.setCursorPos({rowId: rec.id});
        }
      };

      const manualDateChange = () => {
        // User changed date manually
      };

      return {
        ready,
        records,
        selectedDate,
        currentSessions,
        slots,
        stations,
        getCell,
        formatInstr,
        selectRecord,
        manualDateChange
      };
    }
  }).mount('#app');
</script>

</body>
</html>
