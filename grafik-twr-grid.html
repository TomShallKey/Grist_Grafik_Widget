<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grafik Szkoleniowy TWR</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121a;
      --bg-card: #1a1a24;
      --bg-hover: #22222e;
      --border-subtle: rgba(255,255,255,0.06);
      --border-active: rgba(255,255,255,0.12);
      --text-primary: #f0f0f5;
      --text-secondary: #8888a0;
      --text-muted: #555566;
      
      --faza-1: #22c55e;
      --faza-1-bg: rgba(34, 197, 94, 0.12);
      --faza-2: #3b82f6;
      --faza-2-bg: rgba(59, 130, 246, 0.12);
      --faza-3: #f59e0b;
      --faza-3-bg: rgba(245, 158, 11, 0.12);
      --faza-4: #ef4444;
      --faza-4-bg: rgba(239, 68, 68, 0.12);
      --faza-5: #a855f7;
      --faza-5-bg: rgba(168, 85, 247, 0.12);
      
      --trainee-a: #22c55e;
      --trainee-a-bg: rgba(34, 197, 94, 0.08);
      --trainee-b: #3b82f6;
      --trainee-b-bg: rgba(59, 130, 246, 0.08);
      
      --slot-height: 80px;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: auto;
    }
    
    .container { padding: 20px; min-width: fit-content; }
    
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-subtle);
    }
    
    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #fff 0%, #888 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    
    .legend {
      display: flex;
      gap: 16px;
      align-items: center;
    }
    
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
    
    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 3px;
    }
    
    .calendar-grid {
      display: grid;
      gap: 1px;
      background: var(--border-subtle);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }
    
    .time-header {
      background: var(--bg-secondary);
      padding: 16px 12px;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .day-header {
      background: var(--bg-secondary);
      padding: 14px 16px;
      text-align: center;
      border-bottom: 1px solid var(--border-subtle);
    }
    
    .day-name {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }
    
    .day-date {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    
    .time-slot {
      background: var(--bg-secondary);
      padding: 8px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-secondary);
      display: flex;
      align-items: flex-start;
      justify-content: center;
      min-height: var(--slot-height);
    }
    
    .cell {
      background: var(--bg-primary);
      min-height: var(--slot-height);
      position: relative;
      padding: 4px;
    }
    
    .session-card {
      position: absolute;
      left: 4px;
      right: 4px;
      top: 4px;
      background: var(--bg-card);
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
    }
    
    .session-card:hover {
      border-color: var(--border-active);
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    
    .session-card.warning {
      border-color: rgba(239, 68, 68, 0.4);
      box-shadow: 0 0 0 1px rgba(239, 68, 68, 0.2);
    }
    
    .session-content {
      padding: 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    /* Trainee row - A po lewej, B po prawej */
    .trainee-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .trainee-item {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }
    
    .trainee-item.side-a {
      justify-content: flex-start;
    }
    
    .trainee-item.side-b {
      justify-content: flex-end;
      text-align: right;
    }
    
    .trainee-divider {
      width: 1px;
      height: 20px;
      background: var(--border-active);
      flex-shrink: 0;
    }
    
    .trainee-badge {
      font-size: 0.6rem;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    
    .trainee-badge.badge-a {
      background: var(--trainee-a-bg);
      color: var(--trainee-a);
    }
    
    .trainee-badge.badge-b {
      background: var(--trainee-b-bg);
      color: var(--trainee-b);
    }
    
    .trainee-name {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .ex-number {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    
    /* Meta row - fazy, instruktorzy, kategoria */
    .session-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding-top: 6px;
      border-top: 1px solid var(--border-subtle);
    }
    
    .faza-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 3px;
    }
    
    .faza-1 { background: var(--faza-1-bg); color: var(--faza-1); }
    .faza-2 { background: var(--faza-2-bg); color: var(--faza-2); }
    .faza-3 { background: var(--faza-3-bg); color: var(--faza-3); }
    .faza-4 { background: var(--faza-4-bg); color: var(--faza-4); }
    .faza-5 { background: var(--faza-5-bg); color: var(--faza-5); }
    
    .instructor-list {
      font-size: 0.7rem;
      color: var(--text-secondary);
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    
    .kategoria-badge {
      font-size: 0.6rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 3px;
      background: rgba(255,255,255,0.06);
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.03em;
      flex-shrink: 0;
    }
    
    .session-time-range {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--text-muted);
      text-align: center;
      padding: 4px 8px;
      background: rgba(0,0,0,0.15);
    }
    
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 400px;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }
    
    .loading-spinner {
      width: 24px;
      height: 24px;
      border: 2px solid var(--border-subtle);
      border-top-color: var(--faza-2);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 12px;
    }
    
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .no-data {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }
    
    .no-data-icon {
      font-size: 3rem;
      margin-bottom: 16px;
      opacity: 0.3;
    }
    
    /* Tooltip */
    .tooltip {
      position: fixed;
      background: var(--bg-card);
      border: 1px solid var(--border-active);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 0.8rem;
      max-width: 350px;
      z-index: 1000;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      pointer-events: none;
      opacity: 0;
      transform: translateY(4px);
      transition: all 0.15s ease;
    }
    
    .tooltip.visible {
      opacity: 1;
      transform: translateY(0);
    }
    
    .tooltip-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 4px 0;
    }
    
    .tooltip-label {
      color: var(--text-muted);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    
    .tooltip-value {
      color: var(--text-primary);
      font-weight: 500;
      text-align: right;
      max-width: 220px;
    }

  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>📋 Grafik Szkoleniowy TWR</h1>
      <div class="legend">
        <div class="legend-item"><div class="legend-dot" style="background: var(--trainee-a)"></div>Trainee A</div>
        <div class="legend-item"><div class="legend-dot" style="background: var(--trainee-b)"></div>Trainee B</div>
        <span style="margin: 0 8px; color: var(--text-muted)">|</span>
        <div class="legend-item"><div class="legend-dot" style="background: var(--faza-1)"></div>F1</div>
        <div class="legend-item"><div class="legend-dot" style="background: var(--faza-2)"></div>F2</div>
        <div class="legend-item"><div class="legend-dot" style="background: var(--faza-3)"></div>F3</div>
        <div class="legend-item"><div class="legend-dot" style="background: var(--faza-4)"></div>F4</div>
      </div>
    </div>
    
    <div id="calendar-container">
      <div class="loading">
        <div class="loading-spinner"></div>
        Ładowanie danych z Grist...
      </div>
    </div>
  </div>
  
  <div class="tooltip" id="tooltip"></div>

  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script>
    let allRecords = [];
    
    grist.ready({
      columns: [
        'Data', 'Slot', 'Slot_Godz_od', 'Slot_Godz_do',
        'TWR1_TraineeA', 'TWR1_TraineeB', 'TraineeA_Nazwa', 'TraineeB_Nazwa',
        'TWR1_TraineeA_Faza', 'TWR1_TraineeB_Faza',
        'exNrA', 'exNrB', 'Instr_lista', 'Kat_Nazwa', 'C',
        'Data_DzienPL', 'Data_Tydzien',
        'TraineeA_Narusza8h', 'TraineeB_Narusza8h'
      ],
      requiredAccess: 'read table'
    });
    
    grist.onRecords(function(records, mappings) {
      console.log('Received records:', records.length, records);
      allRecords = records.map(r => mapRecord(r, mappings));
      renderCalendar();
    });
    
    function mapRecord(rec, mappings) {
      const get = (col) => {
        if (mappings && mappings[col]) {
          return rec[mappings[col]];
        }
        return rec[col];
      };
      
      return {
        id: rec.id,
        data: get('Data'),
        slot: get('Slot'),
        slotOd: get('Slot_Godz_od'),
        slotDo: get('Slot_Godz_do'),
        traineeA: get('TWR1_TraineeA'),
        traineeB: get('TWR1_TraineeB'),
        traineeANazwa: get('TraineeA_Nazwa') || '',
        traineeBNazwa: get('TraineeB_Nazwa') || '',
        fazaA: get('TWR1_TraineeA_Faza'),
        fazaB: get('TWR1_TraineeB_Faza'),
        exNrA: get('exNrA'),
        exNrB: get('exNrB'),
        instrLista: get('Instr_lista') || '',
        kategoria: get('Kat_Nazwa') || '',
        c: get('C'),
        dzienPL: get('Data_DzienPL') || '',
        tydzien: get('Data_Tydzien') || '',
        narusza8hA: get('TraineeA_Narusza8h'),
        narusza8hB: get('TraineeB_Narusza8h')
      };
    }
    
    function parseTime(timeStr) {
      if (!timeStr) return null;
      const parts = String(timeStr).split(':');
      return parseInt(parts[0]) * 60 + (parseInt(parts[1]) || 0);
    }
    
    function getFazaNumber(fazaValue) {
      // Handle all empty/null/undefined/falsy cases
      if (fazaValue === null || fazaValue === undefined) return null;
      if (fazaValue === 0 || fazaValue === '') return null;
      if (typeof fazaValue === 'object') {
        // Grist może zwrócić obiekt Reference - sprawdź czy ma wartość
        if (Array.isArray(fazaValue) && fazaValue.length === 0) return null;
        if (fazaValue.id === 0 || !fazaValue.id) return null;
        // Spróbuj wyciągnąć z obiektu
        return null;
      }
      
      const str = String(fazaValue).trim();
      if (!str || str === '0' || str.toLowerCase() === 'null' || str.toLowerCase() === 'undefined') {
        return null;
      }
      
      // Szukaj liczby w stringu (np. "F2", "Faza 3", "2")
      const match = str.match(/(\d+)/);
      return match ? parseInt(match[1]) : null;
    }
    
    function groupConsecutiveSessions(sessions) {
      if (!sessions.length) return [];
      
      sessions.sort((a, b) => parseTime(a.slotOd) - parseTime(b.slotOd));
      
      const groups = [];
      let currentGroup = [sessions[0]];
      
      for (let i = 1; i < sessions.length; i++) {
        const prev = sessions[i - 1];
        const curr = sessions[i];
        
        const prevEnd = parseTime(prev.slotDo);
        const currStart = parseTime(curr.slotOd);
        
        const sameTraineeA = prev.traineeA === curr.traineeA;
        const sameTraineeB = prev.traineeB === curr.traineeB;
        const isConsecutive = Math.abs(currStart - prevEnd) <= 15;
        
        if (isConsecutive && sameTraineeA && sameTraineeB) {
          currentGroup.push(curr);
        } else {
          groups.push(currentGroup);
          currentGroup = [curr];
        }
      }
      groups.push(currentGroup);
      
      return groups;
    }
    
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
    
    function renderCalendar() {
      const container = document.getElementById('calendar-container');
      
      if (!allRecords.length) {
        container.innerHTML = `
          <div class="no-data">
            <div class="no-data-icon">📅</div>
            <p>Brak danych do wyświetlenia</p>
            <p style="font-size: 0.8rem; margin-top: 8px; opacity: 0.6">
              Upewnij się, że widget ma dostęp do tabeli GRAFIK
            </p>
          </div>
        `;
        return;
      }
      
      const uniqueDays = [...new Set(allRecords.map(r => r.data))].filter(Boolean).sort((a, b) => a - b);
      const uniqueSlots = [...new Set(allRecords.map(r => r.slotOd))].filter(Boolean);
      uniqueSlots.sort((a, b) => parseTime(a) - parseTime(b));
      
      const dayNames = {};
      allRecords.forEach(r => {
        if (r.data && r.dzienPL) {
          dayNames[r.data] = r.dzienPL;
        }
      });
      
      let html = `
        <div class="calendar-grid" style="grid-template-columns: 70px repeat(${uniqueDays.length}, minmax(240px, 1fr));">
          <div class="time-header">Godziny</div>
      `;
      
      uniqueDays.forEach(dayId => {
        const dayName = dayNames[dayId] || '';
        html += `
          <div class="day-header">
            <div class="day-name">${escapeHtml(dayName)}</div>
            <div class="day-date">${escapeHtml(dayId)}</div>
          </div>
        `;
      });
      
      uniqueSlots.forEach((slotTime, slotIndex) => {
        const slotEnd = allRecords.find(r => r.slotOd === slotTime)?.slotDo || '';
        
        html += `<div class="time-slot">${escapeHtml(slotTime)}<br><span style="opacity:0.5">-${escapeHtml(slotEnd)}</span></div>`;
        
        uniqueDays.forEach(dayId => {
          const daySessions = allRecords.filter(r => r.data === dayId);
          const slotSessions = daySessions.filter(r => r.slotOd === slotTime);
          
          const groups = groupConsecutiveSessions(slotSessions);
          
          html += `<div class="cell" data-day="${dayId}" data-slot="${slotTime}">`;
          
          groups.forEach((group) => {
            const first = group[0];
            const last = group[group.length - 1];
            
            const hasTraineeA = first.traineeANazwa && String(first.traineeANazwa).trim() !== '';
            const hasTraineeB = first.traineeBNazwa && String(first.traineeBNazwa).trim() !== '' && first.c;
            
            // Nie renderuj pustych kart
            if (!hasTraineeA && !hasTraineeB) {
              return;
            }
            
            const startTime = parseTime(first.slotOd);
            const endTime = parseTime(last.slotDo);
            const slotDuration = uniqueSlots.length > 1 
              ? parseTime(uniqueSlots[1]) - parseTime(uniqueSlots[0]) 
              : 60;
            const slotsSpanned = Math.max(1, Math.ceil((endTime - startTime) / slotDuration));
            const height = slotsSpanned * 80 - 8;
            
            const fazaANum = getFazaNumber(first.fazaA);
            const fazaBNum = getFazaNumber(first.fazaB);
            
            const hasWarning = first.narusza8hA || first.narusza8hB;
            
            // Prepare tooltip data
            const tooltipData = {
              slotOd: first.slotOd,
              slotDo: last.slotDo,
              traineeANazwa: first.traineeANazwa,
              traineeBNazwa: first.traineeBNazwa,
              fazaA: fazaANum,
              fazaB: fazaBNum,
              instrLista: first.instrLista,
              narusza8hA: first.narusza8hA,
              narusza8hB: first.narusza8hB,
              c: first.c
            };
            
            html += `
              <div class="session-card ${hasWarning ? 'warning' : ''}" 
                   style="height: ${height}px;"
                   data-session-id="${first.id}"
                   onmouseenter="showTooltip(event, this)"
                   onmouseleave="hideTooltip()"
                   data-tooltip='${escapeHtml(JSON.stringify(tooltipData))}'>
                
                <div class="session-content">
                  <!-- Trainee A | B w jednym wierszu -->
                  <div class="trainee-row">
                    ${hasTraineeA ? `
                      <div class="trainee-item side-a">
                        <span class="trainee-badge badge-a">A</span>
                        <span class="trainee-name">${escapeHtml(first.traineeANazwa)}</span>
                        ${first.exNrA ? `<span class="ex-number">#${first.exNrA}</span>` : ''}
                      </div>
                    ` : '<div class="trainee-item side-a"></div>'}
                    
                    ${hasTraineeA && hasTraineeB ? '<div class="trainee-divider"></div>' : ''}
                    
                    ${hasTraineeB ? `
                      <div class="trainee-item side-b">
                        ${first.exNrB ? `<span class="ex-number">#${first.exNrB}</span>` : ''}
                        <span class="trainee-name">${escapeHtml(first.traineeBNazwa)}</span>
                        <span class="trainee-badge badge-b">B</span>
                      </div>
                    ` : ''}
                  </div>
                  
                  <!-- Meta: fazy, instruktorzy, kategoria -->
                  <div class="session-meta">
                    ${fazaANum ? `<span class="faza-tag faza-${fazaANum}">F${fazaANum}</span>` : ''}
                    ${fazaBNum && fazaBNum !== fazaANum ? `<span class="faza-tag faza-${fazaBNum}">F${fazaBNum}</span>` : ''}
                    <span class="instructor-list">${escapeHtml(first.instrLista) || '—'}</span>
                    ${first.kategoria ? `<span class="kategoria-badge">${escapeHtml(first.kategoria)}</span>` : ''}
                  </div>
                </div>
                
                ${slotsSpanned > 1 ? `<div class="session-time-range">${escapeHtml(first.slotOd)} → ${escapeHtml(last.slotDo)}</div>` : ''}
              </div>
            `;
          });
          
          html += `</div>`;
        });
      });
      
      html += `</div>`;
      container.innerHTML = html;
    }
    
    function showTooltip(event, element) {
      const tooltip = document.getElementById('tooltip');
      let session;
      try {
        session = JSON.parse(element.dataset.tooltip.replace(/&quot;/g, '"').replace(/&#39;/g, "'"));
      } catch(e) {
        console.error('Tooltip parse error:', e);
        return;
      }
      
      let content = `
        <div class="tooltip-row">
          <span class="tooltip-label">Godziny</span>
          <span class="tooltip-value">${session.slotOd} - ${session.slotDo}</span>
        </div>
      `;
      
      if (session.traineeANazwa) {
        content += `
          <div class="tooltip-row">
            <span class="tooltip-label">Trainee A</span>
            <span class="tooltip-value">${session.traineeANazwa}${session.fazaA ? ` (F${session.fazaA})` : ''}</span>
          </div>
        `;
      }
      
      if (session.traineeBNazwa && session.c) {
        content += `
          <div class="tooltip-row">
            <span class="tooltip-label">Trainee B</span>
            <span class="tooltip-value">${session.traineeBNazwa}${session.fazaB ? ` (F${session.fazaB})` : ''}</span>
          </div>
        `;
      }
      
      if (session.instrLista) {
        content += `
          <div class="tooltip-row">
            <span class="tooltip-label">Instruktorzy</span>
            <span class="tooltip-value">${session.instrLista}</span>
          </div>
        `;
      }
      
      if (session.narusza8hA || session.narusza8hB) {
        content += `
          <div class="tooltip-row" style="color: #ef4444;">
            <span class="tooltip-label">⚠️ Uwaga</span>
            <span class="tooltip-value">Naruszenie reguły 8h</span>
          </div>
        `;
      }
      
      tooltip.innerHTML = content;
      
      const rect = element.getBoundingClientRect();
      const tooltipRect = tooltip.getBoundingClientRect();
      
      let left = rect.right + 10;
      let top = rect.top;
      
      // Keep tooltip on screen
      if (left + 350 > window.innerWidth) {
        left = rect.left - 360;
      }
      if (top + 200 > window.innerHeight) {
        top = window.innerHeight - 210;
      }
      
      tooltip.style.left = `${left}px`;
      tooltip.style.top = `${top}px`;
      tooltip.classList.add('visible');
    }
    
    function hideTooltip() {
      document.getElementById('tooltip').classList.remove('visible');
    }
    
  </script>
</body>
</html>
