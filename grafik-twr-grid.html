<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grafik KRL - Matrix View</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <style>
    :root {
      --bg-primary: #f8fafc;
      --bg-card: #ffffff;
      --border-color: #e2e8f0;
      --text-primary: #1e293b;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --accent-blue: #3b82f6;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-orange: #f97316;
      --accent-purple: #8b5cf6;
      --shift2-bg: #f1f5f9;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 12px;
      line-height: 1.3;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ========== KONTROLKI ========== */
    .controls {
      flex-shrink: 0;
      background: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      padding: 8px 16px;
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
    }

    .control-group { display: flex; align-items: center; gap: 6px; }
    .control-label { font-size: 10px; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; }
    
    select {
      padding: 4px 8px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 11px;
    }

    .btn {
      padding: 4px 10px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      background: #f8fafc;
      cursor: pointer;
      font-size: 11px;
    }
    .btn:hover { background: #e2e8f0; }

    .stats { margin-left: auto; display: flex; gap: 10px; font-size: 10px; }
    .stat-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 4px; }
    .stat-dot.total { background: var(--accent-blue); }
    .stat-dot.warning { background: var(--accent-orange); }

    /* ========== SIATKA (MATRIX) ========== */
    .grid-wrapper {
      flex-grow: 1;
      overflow: auto;
      padding: 10px;
    }

    .schedule-grid {
      display: grid;
      /* KLUCZOWA ZMIANA: 1 kolumna czasu + 6 kolumn stanowisk */
      grid-template-columns: 70px repeat(6, 1fr); 
      gap: 2px;
      background: var(--border-color); /* Linie siatki */
      border: 1px solid var(--border-color);
      min-width: 1000px; /* Wymusza przewijanie poziome na małych ekranach */
    }

    /* Nagłówek Dnia (rozciąga się na całą szerokość) */
    .day-header {
      grid-column: 1 / -1;
      background: #e0e7ff;
      color: #3730a3;
      padding: 8px;
      font-weight: 700;
      font-size: 13px;
      border-bottom: 2px solid #c7d2fe;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    /* Nagłówki Stanowisk */
    .station-header {
      background: #f1f5f9;
      padding: 8px 4px;
      text-align: center;
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 11px;
      text-transform: uppercase;
      position: sticky;
      top: 35px; /* Wysokość day-header */
      z-index: 10;
      border-bottom: 1px solid #cbd5e1;
    }

    .station-header.corner {
      background: #f8fafc;
      z-index: 11;
      left: 0;
    }

    /* Wiersz Czasu */
    .time-slot-label {
      background: #fff;
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--text-primary);
      position: sticky;
      left: 0;
      z-index: 5;
    }
    
    .time-slot-label.shift2 { background: #f1f5f9; color: #475569; }

    /* Komórka z danymi */
    .grid-cell {
      background: #fff;
      min-height: 80px;
      position: relative;
    }

    .grid-cell.shift2 { background: #f8fafc; }

    .grid-cell.empty {
      cursor: pointer;
    }
    .grid-cell.empty:hover { background: #f0f9ff; }
    
    /* Plusik przy hover na pustej */
    .grid-cell.empty::after {
      content: '+';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #cbd5e1;
      font-size: 20px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .grid-cell.empty:hover::after { opacity: 1; }

    /* Karta w środku komórki */
    .session-card {
      height: 100%;
      padding: 6px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.1s;
    }
    
    .session-card:hover { background: #f1f5f9; }
    .session-card.selected { background: #eff6ff; border-left-color: var(--accent-blue); }
    
    .session-card.has-error { border-left-color: var(--accent-red); background: #fef2f2; }
    .session-card.has-warning { border-left-color: var(--accent-orange); background: #fffbeb; }

    /* Elementy wewnątrz karty */
    .trainee-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 600;
    }
    .trainee-name { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 80px; }
    .ex-badge { font-size: 9px; background: #e2e8f0; padding: 1px 4px; border-radius: 3px; color: #475569; }
    
    .instr-row {
      font-size: 9px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    
    .status-badges { display: flex; gap: 2px; margin-top: auto; }
    .mini-badge { font-size: 8px; padding: 1px 3px; border-radius: 2px; color: white; font-weight: bold; }
    .bg-red { background: var(--accent-red); }
    .bg-orange { background: var(--accent-orange); }
    .bg-purple { background: var(--accent-purple); }

    /* Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.open { display: flex; }
    .modal { background: white; padding: 20px; border-radius: 8px; width: 400px; max-width: 90%; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .loading { padding: 20px; text-align: center; color: #94a3b8; }
  </style>
</head>
<body>

  <div class="controls">
    <div class="control-group">
      <span class="control-label">Dzień:</span>
      <select id="day-filter" onchange="applyFilters()"></select>
    </div>
    
    <button class="btn" onclick="refreshData()">Odśwież</button>
    <div class="stats">
      <span><span class="stat-dot total"></span><span id="stat-count">0</span> sesji</span>
    </div>
  </div>

  <div class="grid-wrapper">
    <div id="schedule-grid" class="schedule-grid">
      <div class="loading">Ładowanie danych...</div>
    </div>
  </div>
  
  <div id="edit-modal" class="modal-overlay" onclick="if(event.target===this) this.classList.remove('open')">
    <div class="modal">
      <h3>Edycja Sesji</h3>
      <p id="modal-info" style="color: #666; margin: 10px 0; font-size: 12px;"></p>
      <div style="background: #f8fafc; padding: 10px; border: 1px solid #e2e8f0; margin-bottom: 15px;">
        Aby edytować, użyj panelu karty po prawej stronie (Linked Widget) lub kliknij wiersz w tabeli.
      </div>
      <button class="btn" onclick="document.getElementById('edit-modal').classList.remove('open')">Zamknij</button>
    </div>
  </div>

  <script>
    // ============================================
    // KONFIGURACJA STANOWISK
    // ============================================
    // WPISZ TUTAJ DOKŁADNE NAZWY STANOWISK JAKIE MASZ W TABELI "Stanowiska"
    // Kolejność tutaj decyduje o kolejności kolumn
    const STATION_ORDER = ['TWR1', 'TWR2', 'TWR3', 'TWR4', 'TWR5', 'Beczka', 'Poznań']; 
    
    // Jeśli nazwy w rekordach są inne, skrypt spróbuje je dopasować, 
    // ale najlepiej żeby pasowały do tego co zwraca kolumna Stanowisko.
    
    const SECOND_SHIFT_START = '14:00';

    let allRecords = [];
    let filteredRecords = [];
    let selectedRecordId = null;

    grist.ready({ requiredAccess: 'read table' });

    grist.onRecords((records) => {
      if (records.length > 0) {
        // Mapowanie danych
        allRecords = records.map(rec => ({
          id: rec.id,
          // Zakładam, że pole Stanowisko zwraca nazwę lub jest referencją gdzie Grist zwraca display value
          // Jeśli to referencja, trzeba sprawdzić czy Grist zwraca ID czy String.
          // Używamy bezpiecznego dostępu
          stanowisko: extractStationName(rec.Stanowisko),
          
          data: rec.Data,
          dzienPL: rec.Data_DzienPL, // Formuła z tabeli
          godzOd: rec.Slot_Godz_od,
          godzDo: rec.Slot_Godz_do,
          
          traineeA: rec.TraineeA_Nazwa,
          traineeB: rec.TraineeB_Nazwa,
          exNrA: rec.exNrA,
          exNrB: rec.exNrB,
          c: rec.C,
          
          instr1: rec.Instr1,
          instr2: rec.Instr2,
          
          duplikaty: rec.TraineeDuplikaty,
          narusza8h: rec.TraineeA_Narusza8h || rec.TraineeB_Narusza8h
        }));
        
        // Sortowanie po godzinie
        allRecords.sort((a, b) => (a.godzOd || '').localeCompare(b.godzOd || ''));
        
        updateFilters();
        applyFilters();
      }
    });

    // Funkcja pomocnicza do wyciągnięcia nazwy stanowiska
    function extractStationName(val) {
      if (!val) return 'Inne';
      // Jeśli Grist zwraca obiekt referencji
      if (typeof val === 'object' && val.Stanowisko) return val.Stanowisko; 
      // Jeśli zwraca string
      return String(val);
    }

    function updateFilters() {
      const days = [...new Set(allRecords.map(r => r.dzienPL))].filter(Boolean);
      const sel = document.getElementById('day-filter');
      const current = sel.value;
      
      sel.innerHTML = days.map(d => `<option value="${d}">${d}</option>`).join('');
      
      // Jeśli nic nie wybrano, wybierz pierwszy dostępny dzień
      if (!current && days.length > 0) sel.value = days[0];
    }

    function applyFilters() {
      const day = document.getElementById('day-filter').value;
      // Filtrujemy rekordy dla wybranego dnia
      filteredRecords = allRecords.filter(r => r.dzienPL === day);
      
      document.getElementById('stat-count').innerText = filteredRecords.length;
      renderGrid(day);
    }

    function renderGrid(day) {
      const grid = document.getElementById('schedule-grid');
      
      if (!day) {
        grid.innerHTML = '<div class="loading">Brak danych / Wybierz dzień</div>';
        return;
      }

      // 1. Pobierz unikalne sloty czasowe występujące w tym dniu
      const slots = [...new Set(filteredRecords.map(r => r.godzOd))].filter(Boolean).sort();
      
      if (slots.length === 0) {
        grid.innerHTML = '<div class="loading">Brak sesji w tym dniu</div>';
        return;
      }

      let html = '';

      // --- NAGŁÓWKI ---
      
      // Główny nagłówek dnia
      html += `<div class="day-header">${day}</div>`;
      
      // Nagłówki stanowisk (Pierwsza komórka pusta nad czasem)
      html += `<div class="station-header corner">Godz</div>`;
      STATION_ORDER.forEach(st => {
        html += `<div class="station-header">${st}</div>`;
      });

      // --- WIERSZE (SLOTY) ---
      slots.forEach(slot => {
        const isShift2 = slot >= SECOND_SHIFT_START;
        const shiftClass = isShift2 ? 'shift2' : '';
        
        // Etykieta czasu (1. kolumna)
        html += `
          <div class="time-slot-label ${shiftClass}">
            ${slot}
          </div>
        `;

        // Komórki dla każdego stanowiska (6 kolumn)
        STATION_ORDER.forEach(station => {
          // Znajdź rekord dla tego slotu i tego stanowiska
          const rec = filteredRecords.find(r => r.godzOd === slot && r.stanowisko === station);
          
          if (rec) {
            html += `<div class="grid-cell ${shiftClass}">
              ${renderCard(rec)}
            </div>`;
          } else {
            // Pusta komórka (możliwość dodania onclick)
            html += `<div class="grid-cell empty ${shiftClass}" 
                 onclick="console.log('Kliknięto pusty: ${day} ${slot} ${station}')"
                 title="Brak sesji: ${station}"></div>`;
          }
        });
      });

      grid.innerHTML = html;
    }

    function renderCard(rec) {
      let classes = 'session-card';
      if (rec.duplikaty) classes += ' has-warning';
      if (rec.narusza8h) classes += ' has-error';
      if (selectedRecordId === rec.id) classes += ' selected';

      // Instruktorzy - sklej imiona
      const instrs = [rec.instr1, rec.instr2].filter(x => x && x !== 0 && x !== '0').join(', ');
      
      // Badges
      let badges = '';
      if (rec.c && rec.traineeB) badges += `<span class="mini-badge bg-purple">+B</span>`;
      if (rec.narusza8h) badges += `<span class="mini-badge bg-red">8h</span>`;
      if (rec.duplikaty) badges += `<span class="mini-badge bg-orange">DUP</span>`;

      return `
        <div class="${classes}" onclick="selectRecord(${rec.id})">
          <div class="trainee-row">
            <span class="trainee-name" title="${rec.traineeA}">${rec.traineeA || '-'}</span>
            <span class="ex-badge">${rec.exNrA || '?'}</span>
          </div>
          
          ${rec.traineeB ? `
          <div class="trainee-row" style="opacity: 0.8">
            <span class="trainee-name" title="${rec.traineeB}">${rec.traineeB}</span>
            <span class="ex-badge">${rec.exNrB || '-'}</span>
          </div>` : ''}

          <div class="instr-row">${instrs}</div>
          
          <div class="status-badges">${badges}</div>
        </div>
      `;
    }

    function selectRecord(id) {
      selectedRecordId = id;
      grist.setCursorPos({ rowId: id }); // Synchronizacja z Gristem
      
      // Odśwież widok (aby pokazać zaznaczenie) - w prawdziwej appce lepiej robić to klasą CSS bez reloadu
      const day = document.getElementById('day-filter').value;
      renderGrid(day);
    }
    
    function refreshData() {
      location.reload(); 
    }
  </script>
</body>
</html>
